services:
  mongodb:
    image: mongo:8.0
    container_name: lotf-mongodb
    # the database is only ever reached from the app container; publishing it on
    # 0.0.0.0 exposed an unauthenticated MongoDB to the whole network
    ports:
      - "127.0.0.1:27017:27017"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./init.mongo.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: mongosh mongodb://localhost:27017/admin --quiet --eval "db.runCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  lotf:
    image: ghcr.io/kawakode/lords-of-the-fey:latest
    container_name: lotf-app
    depends_on:
      mongodb:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      MONGO_STRING: ${MONGO_STRING:-mongodb://mongodb:27017}
      PORT: 8080
      LISTENING_IP: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET_not_set}
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      # set to 1 only when a reverse proxy you control sets X-Forwarded-*
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "8180:8080"
    volumes:
      - ./static:/app/static:ro
      - ./views:/app/views:ro
