<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Room</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../client/jquery-2.0.3.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/theme.css" />
    <link rel="stylesheet" type="text/css" href="/css/lobby.css" />
  </head>
  <body class="fey-page">

    <div id="top-main-menu">
      <div style="float:left;">
        <b><a href="/">Lords of the Fey</a></b>
      </div>
      <div class="username-main-menu" style="float:right;">
        <a href="/lobby">&#9664; Back to lobby</a>
      </div>
    </div>

    <div class="fey-shell">
      <div id="room-container">

        <h1 class="fey-title" style="font-size: 30px;">War Council</h1>
        <div class="fey-rule"><span></span></div>

        <div class="fey-panel">
          <div class="fey-panel-heading">Order of battle</div>
          <table id="room-player-list">
            <tr><th></th><th>Player</th><th>Faction</th><th>Alliance</th><tr>
          </table>
        </div>

        <div class="fey-room-actions">
          <input type="button" value="Start game" id="start-game-button" class="fey-button-primary" disabled="disabled" title="When all players are ready, the game can be launched">
          <input type="button" value="Add anon player" id="add-anon-button" disabled="disabled" title="Only the room owner can add anonymous players">
        </div>

        <div id="chat">
          <div id="chat-messages" class="fey-scrollable"></div>
          <input type="text" id="chat-input" placeholder="Speak, and the council will hear you">
        </div>

      </div>
    </div>

    <script src="room.js"></script>
  </body>
</html>
