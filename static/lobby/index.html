<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lobby</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../client/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/theme.css" />
    <link rel="stylesheet" type="text/css" href="/css/lobby.css" />
  </head>
  <body class="fey-page">

    <div id="top-main-menu">
      <div style="float:left;">
        <b><a href="/">Lords of the Fey</a></b>
      </div>
      <div class="username-main-menu" style="float:right;">
        <a href="/gamelist">Your campaigns</a> &#9670; <a href="/logout">Log out</a>
      </div>
    </div>

    <div class="fey-shell fey-shell-wide">

      <div id="lobby-menu">
        <div class="fey-lobby-title">The Lobby</div>
        <input type="button" value="Raise a Room" id="create-game" class="fey-button-primary">
      </div>

      <div id="lobby-below-menu">
        <div id="player-list" class="fey-panel fey-panel-wood fey-scrollable"></div>

        <div id="room-list" class="fey-panel fey-scrollable"></div>
      </div>

      <div id="chat">
        <div id="chat-messages" class="fey-scrollable"></div>
        <input type="text" id="chat-input" placeholder="Speak, and the hall will hear you">
      </div>

    </div>

    <div style="display:none;" id="create-dialog">
      <div id="create-dialog-inner">
        <div class="fey-dialog-title"><span>New Game</span><span class="fey-dialog-hint">Esc to return</span></div>
        <div>
          <label for="create-dialog-name">Room name</label>
          <input type="text" id="create-dialog-name">
        </div>
        <div>
          <label for="create-dialog-map">Battlefield</label>
          <select id="create-dialog-map"></select>
        </div>
        <div class="fey-dialog-actions"><input type="button" value="Launch Room" id="launch-game" class="fey-button-primary"></div>
      </div>
    </div>

    <script src="lobby.js"></script>
  </body>
</html>
